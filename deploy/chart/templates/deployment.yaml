apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: trove
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: trove
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trove
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: trove
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.postgres.url }}
            - name: TROVE_POSTGRES_URL
              value: {{ .Values.postgres.url | quote }}
            {{- else if .Values.postgres.existingSecret }}
            - name: TROVE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.existingSecretKey }}
            {{- end }}
            {{- if .Values.rootCredentials.accessKey }}
            - name: TROVE_ROOT_ACCESS_KEY
              value: {{ .Values.rootCredentials.accessKey | quote }}
            {{- end }}
            {{- if .Values.rootCredentials.secretKey }}
            - name: TROVE_ROOT_SECRET_KEY
              value: {{ .Values.rootCredentials.secretKey | quote }}
            {{- end }}
            {{- if .Values.rootCredentials.existingSecret }}
            - name: TROVE_ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rootCredentials.existingSecret }}
                  key: TROVE_ROOT_ACCESS_KEY
            - name: TROVE_ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rootCredentials.existingSecret }}
                  key: TROVE_ROOT_SECRET_KEY
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
