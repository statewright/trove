name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bug/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trove
          POSTGRES_PASSWORD: trove
          POSTGRES_DB: trove
        options: >-
          --health-cmd "pg_isready -U trove"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          PG_TEST_URL: postgres://trove:trove@localhost:5432/trove?sslmode=disable
        run: go test -v -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 go build -o trove ./cmd/trove

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t trove:ci .
